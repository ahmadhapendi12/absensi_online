services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lazatto_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lazatto_network

  web:
    image: nginx:alpine
    container_name: lazatto_web
    restart: unless-stopped
    ports:
      # Port 8080 di-bind hanya ke localhost (127.0.0.1) agar tidak terekspos langsung,
      # dan aman untuk di-reverse-proxy oleh Nginx utama VPS di port 80/443
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - lazatto_network

  db:
    image: postgres:16-alpine
    container_name: lazatto_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-lazatoabsensi}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lazattosecret2026}
    volumes:
      - lazatto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-lazatoabsensi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lazatto_network

networks:
  lazatto_network:
    driver: bridge

volumes:
  lazatto_pgdata:
    driver: local
